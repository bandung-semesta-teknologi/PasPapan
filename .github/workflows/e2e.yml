name: E2E Smoke

on:
  push:
    branches: ["main", "main-vps", "develop"]
  pull_request:

jobs:
  playwright:
    name: Playwright smoke
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: "8.3"
      NODE_VERSION: "20"
      BUN_VERSION: "1.3.6"
      EVIDENCE_DIR: storage/review-evidence

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paspapan_e2e
          POSTGRES_USER: paspapan
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U paspapan -d paspapan_e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, gd, intl, mbstring, pdo_pgsql, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Prepare environment
        run: |
          mkdir -p "${EVIDENCE_DIR}"
          cp .env.example .env
          cat <<'EOF' >> .env
          APP_ENV=testing
          APP_DEBUG=true
          APP_URL=http://127.0.0.1:8000
          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=paspapan_e2e
          DB_USERNAME=paspapan
          DB_PASSWORD=secret
          DB_SCHEMA=public
          DB_SSLMODE=prefer
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=file
          MAIL_MAILER=array
          BROADCAST_CONNECTION=log
          EOF

      - name: Prepare app
        run: |
          php artisan key:generate --force
          chmod -R ug+rwx storage bootstrap/cache
          php artisan migrate --force
          php scripts/prepare-apk-screenshots-demo.php
          bun run build

      - name: Start Laravel
        run: php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/e2e-server.log 2>&1 &

      - name: Wait for Laravel
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/e2e-server.log
          exit 1

      - name: Run Playwright smoke
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_ADMIN_EMAIL: apk.demo.superadmin@paspapan.test
          E2E_ADMIN_PASSWORD: "12345678"
          E2E_USER_EMAIL: apk.demo.user@paspapan.test
          E2E_USER_PASSWORD: "12345678"
        run: |
          set -o pipefail
          bun run e2e:smoke 2>&1 | tee "${EVIDENCE_DIR}/playwright-smoke.log"

      - name: Summarize Playwright evidence
        if: always()
        run: |
          {
            echo "## Playwright Smoke Evidence"
            echo
            echo "- Log: playwright-smoke.log"
            echo "- Report: playwright-report artifact"
            echo "- Test results: test-results artifact"
          } | tee "${EVIDENCE_DIR}/playwright-summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-evidence-playwright
          path: |
            storage/review-evidence
            test-results
          if-no-files-found: ignore
