name: Coverage Baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "31 19 * * 2"

jobs:
  coverage:
    name: Pest coverage summary
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: "8.3"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paspapan_coverage
          POSTGRES_USER: paspapan
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U paspapan -d paspapan_coverage"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP with PCOV
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, gd, intl, mbstring, pcov, pdo_pgsql, zip
          coverage: pcov
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          cat <<'EOF' >> .env
          APP_ENV=testing
          APP_DEBUG=true
          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=paspapan_coverage
          DB_USERNAME=paspapan
          DB_PASSWORD=secret
          DB_SCHEMA=public
          DB_SSLMODE=prefer
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          MAIL_MAILER=array
          BROADCAST_CONNECTION=log
          EOF

      - name: Generate key and migrate
        run: |
          php artisan key:generate --force
          php artisan migrate --force

      - name: Run coverage summary
        env:
          XDEBUG_MODE: coverage
        run: php artisan test --coverage --min=0
