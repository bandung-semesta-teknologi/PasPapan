name: Deploy with Docker Compose

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Docker Compose to production
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main-vps' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: paspapan-compose-production
      cancel-in-progress: false

    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_USER: ${{ vars.USER }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Configure pinned SSH host key
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [[ -z "$DEPLOY_HOST" ]]; then
            echo "::error::GitHub secret HOST is empty or unavailable to the production environment."
            exit 1
          fi

          if [[ -z "$SSH_KNOWN_HOSTS" ]]; then
            echo "::error::GitHub secret SSH_KNOWN_HOSTS is empty or unavailable to the production environment."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          if ! ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null; then
            echo "::error::SSH_KNOWN_HOSTS has no host-key entry matching HOST. Store a known_hosts line for the same host (without a username)."
            exit 1
          fi

      - name: Check deployment host prerequisites
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
        run: |
          if [[ -z "$DEPLOY_PATH" ]]; then
            echo "::error::Set DEPLOY_PATH as a variable in the production environment."
            exit 1
          fi

          if [[ -z "$DEPLOY_USER" ]]; then
            echo "::error::Set USER as a variable in the production environment."
            exit 1
          fi

          if [[ -z "$APP_DOMAIN" || ! "$APP_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Set APP_DOMAIN as a bare domain name in the production environment (without scheme, port, or path)."
            exit 1
          fi

          ssh -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -eu
             mkdir -p '${DEPLOY_PATH}'
             command -v rsync >/dev/null || { echo 'rsync is not installed or unavailable to ${DEPLOY_USER}.' >&2; exit 1; }
             docker compose version
             docker network inspect proxy >/dev/null || { echo 'Docker is inaccessible or the external proxy network is missing.' >&2; exit 1; }"

      - name: Write production environment file
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_NAME: ${{ vars.APP_NAME }}
          APP_TIMEZONE: ${{ vars.APP_TIMEZONE }}
          DB_DATABASE: ${{ vars.DB_DATABASE }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          MAIL_MAILER: ${{ vars.MAIL_MAILER }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_ENCRYPTION: ${{ vars.MAIL_ENCRYPTION }}
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
        run: |
          for required_name in APP_KEY APP_DOMAIN DB_PASSWORD; do
            if [[ -z "${!required_name}" ]]; then
              echo "::error::Set ${required_name} in the production GitHub Environment (as a secret or variable, as appropriate)."
              exit 1
            fi
          done

          python3 - <<'PY' | ssh -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "umask 077 && cat > '${DEPLOY_PATH}/.env' && chmod 600 '${DEPLOY_PATH}/.env'"
          import os
          import sys

          def dotenv_quote(value):
              value = value.replace("\\", "\\\\")
              value = value.replace('"', '\\"').replace("$", "\\$")
              value = value.replace("\r", "\\r").replace("\n", "\\n")
              value = value.replace("\t", "\\t")
              return f'"{value}"'

          values = {
              "APP_NAME": os.environ.get("APP_NAME") or "PasPapan",
              "APP_DOMAIN": os.environ["APP_DOMAIN"],
              "APP_ENV": "production",
              "APP_DEBUG": "false",
              "APP_KEY": os.environ["APP_KEY"],
              "APP_URL": f"https://{os.environ['APP_DOMAIN']}",
              "APP_TIMEZONE": os.environ.get("APP_TIMEZONE") or "Asia/Jakarta",
              "DB_DATABASE": os.environ.get("DB_DATABASE") or "paspapan",
              "DB_USERNAME": os.environ.get("DB_USERNAME") or "paspapan",
              "DB_PASSWORD": os.environ["DB_PASSWORD"],
              "SESSION_ENCRYPT": "true",
              "SESSION_SECURE_COOKIE": "true",
          }

          mailer = os.environ.get("MAIL_MAILER", "").strip()
          if mailer:
              values["MAIL_MAILER"] = mailer

          if mailer == "smtp":
              required_mail = ("MAIL_HOST", "MAIL_PORT", "MAIL_USERNAME", "MAIL_PASSWORD", "MAIL_FROM_ADDRESS")
              missing_mail = [name for name in required_mail if not os.environ.get(name)]
              if missing_mail:
                  sys.stderr.write(f"::error::SMTP is enabled but these production settings are missing: {', '.join(missing_mail)}.\n")
                  raise SystemExit(1)

              values.update({
                  "MAIL_HOST": os.environ["MAIL_HOST"],
                  "MAIL_PORT": os.environ["MAIL_PORT"],
                  "MAIL_ENCRYPTION": os.environ.get("MAIL_ENCRYPTION") or "tls",
                  "MAIL_USERNAME": os.environ["MAIL_USERNAME"],
                  "MAIL_PASSWORD": os.environ["MAIL_PASSWORD"],
                  "MAIL_FROM_ADDRESS": os.environ["MAIL_FROM_ADDRESS"],
                  "MAIL_FROM_NAME": os.environ.get("MAIL_FROM_NAME") or values["APP_NAME"],
              })

          for name, value in values.items():
              sys.stdout.write(f"{name}={dotenv_quote(value)}\n")
          PY

      - name: Upload source and Compose files
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
        run: |
          rsync -az --delete \
            --exclude='/.env' \
            --filter='protect /.env' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/vendor/' \
            --exclude='/node_modules/' \
            --exclude='/storage/' \
            --exclude='/tests/' \
            --exclude='/test-results/' \
            --exclude='/screenshots/' \
            --exclude='/android/' \
            --exclude='/ios/' \
            --exclude='/capacitor-www/' \
            --exclude='/docs/' \
            --exclude='/secure_tools/' \
            --exclude='/enterprise_build/' \
            -e "ssh -o StrictHostKeyChecking=yes" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Build and start the Compose stack
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
        run: |
          if ! ssh -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && \
             docker compose build --pull app web && \
             docker compose up -d --no-build --remove-orphans --wait --wait-timeout 600 && \
             docker compose ps"; then
            ssh -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "cd '${DEPLOY_PATH}' && docker compose ps && docker compose logs --tail=100 app web queue scheduler db" || true
            exit 1
          fi
