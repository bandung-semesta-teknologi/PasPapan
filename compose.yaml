name: paspapan

x-app-environment: &app-environment
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-paspapan}
  DB_USERNAME: ${DB_USERNAME:-paspapan}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_SCHEMA: ${DB_SCHEMA:-public}
  DB_SSLMODE: ${DB_SSLMODE:-prefer}
  DB_QUEUE_RETRY_AFTER: "180"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-paspapan}
      POSTGRES_USER: ${DB_USERNAME:-paspapan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - database

  app:
    image: ${COMPOSE_PROJECT_NAME:-paspapan}-app:local
    build:
      context: .
      target: app
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${RUN_SEEDERS:-true}
      RUN_OPTIMIZE: ${RUN_OPTIMIZE:-true}
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$socket = @fsockopen('127.0.0.1', 9000); exit($$socket === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - database
      - php
      - egress

  web:
    image: ${COMPOSE_PROJECT_NAME:-paspapan}-web:local
    build:
      context: .
      target: web
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:80"
    volumes:
      - app_storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      php: {}
      proxy:
        aliases:
          - paspapan

  queue:
    image: ${COMPOSE_PROJECT_NAME:-paspapan}-app:local
    build:
      context: .
      target: app
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
      RUN_OPTIMIZE: "true"
    command:
      - php
      - artisan
      - queue:work
      - --queue=maintenance,default
      - --sleep=3
      - --tries=3
      - --timeout=150
      - --max-time=3600
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - database
      - egress

  scheduler:
    image: ${COMPOSE_PROJECT_NAME:-paspapan}-app:local
    build:
      context: .
      target: app
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
      RUN_OPTIMIZE: "true"
    command:
      - php
      - artisan
      - schedule:work
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - database
      - egress

volumes:
  postgres_data:
  app_storage:

networks:
  database:
    internal: true
  php:
    internal: true
  egress:
  proxy:
    external: true
    name: proxy
